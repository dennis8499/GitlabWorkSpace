name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Validate, test, and package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag, manifest, lockfile, and main ancestry
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run check:release

      - name: Run tests with a virtual display
        run: xvfb-run -a npm test

      - name: Package and verify VSIX
        run: npm run package

      - name: Save VSIX for the release job
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Create release and upload VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.vsix)
          if [[ ${#assets[@]} -ne 1 ]]; then
            echo "Expected exactly one VSIX artifact; found ${#assets[@]}" >&2
            exit 1
          fi

          expected_asset="gitlab-workspace-${TAG_NAME#v}.vsix"
          if [[ "$(basename "${assets[0]}")" != "$expected_asset" ]]; then
            echo "Unexpected VSIX artifact: ${assets[0]} (expected $expected_asset)" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

          release_args=(
            "$TAG_NAME"
            "${assets[0]}"
            --title "$TAG_NAME"
            --verify-tag
            --generate-notes
            --repo "$GITHUB_REPOSITORY"
          )
          if [[ "$TAG_NAME" == "v0.1.0" || "$TAG_NAME" =~ ^v[^+]*- ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

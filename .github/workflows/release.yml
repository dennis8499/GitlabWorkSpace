name: Verify and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Validate on ${{ matrix.os }} with Python ${{ matrix.python-version }} and VS Code ${{ matrix.vscode-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            vscode-version: stable
          - os: windows-2022
            python-version: '3.11'
            vscode-version: 1.90.0
          - os: windows-2022
            python-version: '3.11'
            vscode-version: stable
          - os: windows-2022
            python-version: '3.14'
            vscode-version: stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tag, manifest, lockfile, and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run check:release

      - name: Run tests with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: npm test

      - name: Package and verify VSIX
        run: npm run package

      - name: Save verified release assets for the release job
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-assets
          path: |
            dist/*.vsix
            dist/gitlab-workspace-kit-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Create release with the extension, workflow kit, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsix_assets=(dist/*.vsix)
          kit_assets=(dist/gitlab-workspace-kit-*.zip)
          if [[ ${#vsix_assets[@]} -ne 1 || ${#kit_assets[@]} -ne 1 || ! -f dist/SHA256SUMS ]]; then
            echo "Expected one VSIX, one workflow kit ZIP, and SHA256SUMS." >&2
            exit 1
          fi

          expected_asset="gitlab-workspace-${TAG_NAME#v}.vsix"
          expected_kit="gitlab-workspace-kit-${TAG_NAME#v}.zip"
          if [[ "$(basename "${vsix_assets[0]}")" != "$expected_asset" || "$(basename "${kit_assets[0]}")" != "$expected_kit" ]]; then
            echo "Unexpected release artifact names; expected $expected_asset and $expected_kit." >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

          release_args=(
            "$TAG_NAME"
            "${vsix_assets[0]}"
            "${kit_assets[0]}"
            "dist/SHA256SUMS"
            --title "$TAG_NAME"
            --verify-tag
            --generate-notes
            --repo "$GITHUB_REPOSITORY"
          )
          if [[ "$TAG_NAME" == "v0.1.0" || "$TAG_NAME" =~ ^v[^+]*- ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
